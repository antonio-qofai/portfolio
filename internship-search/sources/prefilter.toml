]

# ------------------------------------------------------------------- clearance

# PRD section 5. A role requiring an EXISTING clearance at application is out.
# A role that sponsors one is in and should be surfaced. allow_phrases are
# checked first and veto the kill, because "ability to obtain an active
# security clearance" contains the kill phrase inside a sponsorship offer.
[clearance]
allow_phrases = [
    "ability to obtain", "able to obtain", "eligible to obtain",
    "willing to obtain", "will sponsor", "clearance sponsorship",
    "sponsor a security clearance", "obtain and maintain",
    "eligibility to obtain", "or ability to obtain",
]
kill_phrases = [
    "must have an active security clearance",
    "must possess an active security clearance",
    "must currently hold an active",
    "requires an active ts/sci",
    "active ts/sci clearance is required",
    "active secret clearance is required",
    "active top secret clearance is required",
    "an active security clearance is required",
    "current security clearance is required",
]

# ------------------------------------------------------ graduate-only postings

[degree]
# Aggregator feeds publish the degree levels outright. A posting open only to
# graduate degrees is out; one that admits a bachelor's is in.
undergraduate_feed_degrees = ["bachelor", "associate", "certificate", "incomplete"]

# Checked BEFORE kill_title below, and vetoes it, exactly as
# [clearance].allow_phrases vetoes a clearance kill. A title listing several
# degree levels is open to the lowest one it names, so a bachelor's anywhere in
# the title means the posting is not graduate-only whatever else it says.
#
# This is what makes the bare "phd" kill below safe. Pika's "Research Intern
# (BS/MS/PhD)" takes undergraduates and says so in the title; without this line
# the new rule would kill it silently, which is the exact failure this file
# opens by warning about.
allow_title = [
    "bs/", "ba/", "bs,", "bachelor", "undergrad", "undergraduate", "b.s.",
]

# Title-level signal for the company boards, which publish no degree field.
kill_title = [
    "phd intern", "ph.d. intern", "phd internship", "doctoral intern",
    "phd residency", "phd fellowship", "postdoc", "post-doc", "post doc",
    "mba intern", "mba internship", "mba associate",
    # The suffix form. A company board publishes no degree field, so
    # "Data Science Intern, PhD" is the only signal that posting gives.
    "intern, phd", "internship, phd", "intern - phd", "intern (phd)",
    "intern, ph.d", "intern, mba", "internship, mba",
    # Master's, added 2026-08-12 at the owner's instruction. He is an
    # undergraduate, so a posting restricted to master's students is as much a
    # mismatch as a PhD one, and this was the gap: "Apple: Software Engineering
    # Intern, Masters" and LLNL's "Computing Graduate Student Intern" were both
    # surfacing.
    #
    # "graduate student intern" is safe next to "undergraduate student intern"
    # because matching is word-start anchored, so \bgraduate finds no word
    # boundary inside "undergraduate". Verified against both titles before
    # adding. Do not switch this list to a plain substring match.
    "masters intern", "master's intern", "masters internship",
    "master's internship", "ms intern", "msc intern",
    "graduate student intern", "grad student intern",
    "intern, masters", "intern, master's", "intern - masters",
    "intern (masters)", "internship, masters", "internship, master's",

    # The bare degree name, added 2026-08-14 at the owner's instruction. The
    # patterns above all require the degree to sit next to the word "intern",
    # and three postings put it elsewhere in the title: "PhD GenAI Research
    # Scientist Intern" at Databricks, "PhD Research Scientist Intern" at Canva,
    # and "Hardware Machine Learning PhD Research Internship" at IMC. A title
    # that names a doctorate anywhere is describing who may apply.
    #
    # Safe only because allow_title above runs first. Do not remove that list
    # without removing these three entries with it.
    "phd", "ph.d", "doctoral", "mba",
]

# Description-level signal. Kept deliberately narrow. A posting that merely
# prefers a graduate degree is not graduate-only and must survive.
kill_phrases = [
    "phd students only", "phd candidates only", "open only to phd",
    "must be enrolled in a phd", "must be a phd candidate",
    "graduate students only", "open only to graduate students",
    "restricted to phd", "phd required",
]

# --------------------------------------------------------------- timing rules

# PRD section 5. Each entry maps the term a posting states onto what the agent
# does with it. Both the aggregator feed's term field and Stage 0's reading of
# the description are matched against `patterns` here, so there is one term
# vocabulary and one place to change it.
#
# policy is one of:
#   surface         no timing restriction, goes through
#   part_time_only  in-person full-time roles are filtered SILENTLY. The owner is
#                   in class. Part time, remote, or unstated hours survive.
#   kill            never relevant, drop it
#
# flag, when set, is attached to every surviving posting in that term.

[[term]]
key = "summer2027"
patterns = ["summer 2027", "su 2027", "summer27", "2027 summer"]
policy = "surface"

[[term]]
key = "fall2026"
patterns = ["fall 2026", "autumn 2026", "fa 2026", "2026 fall"]
# Changed from part_time_only to kill on 2026-08-12, at the owner's instruction:
# he cannot do a fall internship at all, part time or otherwise. Spring and
# winter stay open, fall does not. This was 410 of the 1,205 surfaced postings,
# a third of everything the ranker had queued, so it is also the single largest
# cost saving available on the filter.
#
# To reverse: set this back to "part_time_only", then run
# tools.prefilter_report --dry-run, --reapply, and tools.test_prefilter.
policy = "kill"

[[term]]
key = "winter2027"
patterns = ["winter 2027", "wi 2027", "2027 winter"]
policy = "surface"
flag = "leave_required"

[[term]]
key = "spring2027"
patterns = ["spring 2027", "sp 2027", "2027 spring"]
policy = "part_time_only"
# Exception, added 2026-08-09 at the owner's request. A full-time spring 2027 role
# in Chicago is acceptable; he is already there for the term. Everywhere else
# the part-time rule stands and in-person full time is still filtered.
#
# Matched against the posting's location, so "Chicago, IL", "Chicago" and
# "Chicago; New York" all qualify. Adding these same two lines to the fall2026
# entry above would do the same thing for that term.
full_time_ok_locations = ["chicago"]
full_time_ok_flag = "local_full_time"

# Terms that have already closed as of the 2027 cycle. Killed outright.
[[term]]
key = "past"
patterns = [
    "summer 2026", "spring 2026", "winter 2026", "fall 2025", "summer 2025",
    "spring 2025", "winter 2025", "fall 2024", "summer 2024",
]
policy = "kill"

# Beyond the cycle the owner is recruiting for. He graduates June 2028, so a
# fall 2027 or later start is a full-time offer, not an internship. Surfaced
# rather than killed, with a flag, because the boundary is a judgement call and
# a false kill is the failure this system exists to prevent.
[[term]]
key = "beyond_cycle"
patterns = ["fall 2027", "winter 2028", "spring 2028", "summer 2028", "2029"]
policy = "surface"
flag = "outside_cycle"

[terms]
# A posting whose term could not be read at all. PRD section 5: surfaced with a
# flag, never dropped. A missed term is a silent coverage miss.
unknown_policy = "surface"
unknown_flag = "unclear_term"

# A posting that states a term matching none of the entries above, for example
# a bare "Summer" with no year. Same treatment as unknown, for the same reason.
unmatched_policy = "surface"
unmatched_flag = "unclear_term"

# ------------------------------------------------------------ commitment rules

[commitment]
# PRD section 5. Part time means 25 hours per week or less, or explicitly
# described as term time, student, or flexible.
max_part_time_hours = 25

# Any of these in the posting text makes it part-time-compatible regardless of
# a stated hour count.
part_time_phrases = [
    "part time", "part-time", "term time", "term-time", "during the semester",
    "during the school year", "flexible hours", "flexible schedule",
    "around your class", "alongside your studies", "10-20 hours",
    "15-20 hours", "20 hours per week", "student worker", "work study",
    "work-study",
]

# Remote roles survive the part-time-only terms whatever the hours, per PRD
# section 5: "Part time or remote only".
remote_phrases = ["remote", "work from home", "wfh", "distributed", "virtual"]

# A posting in a part-time-only term that states no hours at all is surfaced
# with this flag, never dropped.
unclear_flag = "unclear_commitment"
