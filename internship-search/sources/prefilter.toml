    "sydney", "melbourne", "brisbane", "perth", "auckland", "wellington",
    "toronto", "vancouver", "montreal", "ottawa", "calgary", "waterloo",
    "mississauga", "sao paulo", "mexico city", "guadalajara", "bogota",
