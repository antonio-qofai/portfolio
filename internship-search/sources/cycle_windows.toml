# Known application windows for the Summer 2027 cycle.
#
# This file is data, never code. Add, edit, or delete windows here and the next
# calendar sync picks the change up. Nothing about these companies appears in
# Python source.
#
# key        stable identifier. NEVER change it after an event exists, or the sync
#            creates a duplicate instead of updating the original.
# start/end  real dates. Google all-day events treat the end as inclusive here;
#            the code adds the extra day the API wants.
# confidence  confirmed  = the company has published these dates
#             expected   = based on prior cycles, reliable but not announced
#             uncertain  = rough guess, verify before relying on it
#
# Source for all of these: PRD section 11, as of 2026-08-06. None are confirmed
# by the companies. Treat every date as a prompt to go check, not as gospel.

[[window]]
key = "amazon-summer2027"
company = "Amazon"
label = "Amazon summer 2027 applications"
start = 2026-07-01
end = 2026-08-31
confidence = "expected"
action = "Check amazon.jobs student programs. Amazon posts earliest of anyone."
url = "https://www.amazon.jobs/content/en/career-programs/student-programs"

