# Company token map. This file is data, never code.
#
# Every token below was verified against the live API on 2026-08-06, not guessed.
# To add a company: find its careers page, look at the network requests or the job
# board iframe, and read off the ATS platform and token. Then run
#   python -m tools.verify_tokens
# which proves every token in this file actually returns postings. If you are
# hunting for a token, python -m tools.probe_tokens <guess> <guess> ... tries all
# three platforms at once.
#
# ats must be one of: greenhouse, lever, ashby, workday
# token is the board identifier, not the company name.
#
# A workday token is written host/site, exactly as the careers page address
# reads, because Workday needs a tenant and a site where the others need one
# word. All three of these mean the same board and any of them can be pasted in:
#
#   nvidia.wd5/NVIDIAExternalCareerSite
#   nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#   https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite
#
# python -m tools.probe_workday <url or token> proves one before it is added.
#
# Companies that do not expose one of these three APIs are listed in
# sources/needs-other-approach.md. They are NOT covered by the watcher.

# The [digest] title keyword list that used to sit here was removed on
# 2026-08-07 when Milestone 4 landed. It was a stopgap that narrowed the email
# by title; sources/prefilter.toml now does that properly, under
# [student_role].title_include, alongside the rest of the exclusion rules.
# Two copies of the same list would have drifted apart.

