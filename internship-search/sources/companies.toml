# ------------------------------------------------------------------- workday
#
# How Workday boards are polled, not which ones exist. Added 2026-08-19.
#
# Workday is the only board the agent reads through a search rather than whole,
# because a Workday tenant answers with thousands of postings 20 at a time and
# the other three fetchers cost one request each. That makes these terms load
# bearing in a way no other setting here is: a posting no term matches is never
# seen at all, rather than being seen and filtered out. Widening coverage on
# these boards means adding a term.
#
# Keep them broad and generic. A term naming a company, a city or a specific
# programme would be posting-specific logic, which belongs nowhere, least of all
# in the one place it would be invisible.

[workday]

# The cheap, exact path. Every Workday tenant publishes a `workerSubType` facet
# naming its own job types, and the agent reads those at runtime and asks for
# the ones whose name contains any word below. The ids are per tenant and are
# never written down here; the words are, and they are generic on purpose.
#
# "graduate" is deliberately absent. NVIDIA files 68 postings under "New College
# Graduate" and they are full-time roles for people leaving university now, which
# is not what this agent is for. Add it if that changes.
# Two facets rather than one, queried separately and merged, because Workday
# ANDs across facet parameters: asking for job type Intern and category Interns
# in one query returns only postings that are both.
worker_type_facets = ["workerSubType", "jobFamilyGroup"]
worker_type_matches = ["intern", "co-op", "coop", "student", "apprentice", "trainee"]

# The fallback, and it is off. A tenant naming no student job type raises
# instead, because both alternatives are worse: an empty result reads to the
# watcher as every posting from that source having closed, and a text search is
# the Leidos measurement below.
#
# A search term matches body text as well as titles. Leidos returned 816
# postings in 74 seconds this way, led by "International Program Coordinator",
# which matched because "international" contains "intern". NVIDIA returns 936
# for the same term against 35 under the facet. Turn this on for one tenant and
# it is on for all of them.
search_fallback = false
search_terms = ["intern", "internship", "co-op", "student", "university"]

page_size = 20
max_pages = 20
max_details_per_run = 120

