# Public sync rules. Anything that names a real person, address, account or
# identifier belongs in ~/.config/portfolio-sync/private.toml, not here.

exclude_everywhere = [
    ".env", ".env.*", "*.db", "*.db-*", "*.pem", "credentials*.json", "token*.json",
    ".DS_Store", "*/.DS_Store", ".claude/settings.local.json",
]

# Generic redactions, applied after the private ones.
[[redact]]
# Airtable base, table, view and share IDs.
pattern = '\b(app|tbl|viw|shr)[A-Za-z0-9]{14}\b'
replace = '\1XXXXXXXXXXXXXX'
scan = false

[scan]
secret_patterns = [
    'sk-ant-[A-Za-z0-9_-]{10,}',
    'sk-[A-Za-z0-9]{32,}',
    'gh[opsu]_[A-Za-z0-9]{30,}',
    'github_pat_[A-Za-z0-9_]{30,}',
    'AKIA[0-9A-Z]{16}',
    'AIza[0-9A-Za-z_-]{35}',
    'xox[abpr]-[A-Za-z0-9-]{10,}',
    'pat[A-Za-z0-9]{14}\.[a-f0-9]{40,}',
    '-----BEGIN [A-Z ]*PRIVATE KEY-----',
    '''(?i)(client_secret|app_password|api_key)\s*[:=]\s*["'][A-Za-z0-9_/+=-]{16,}["']''',
    '\b(app|tbl|viw|shr)(?!X{14})[A-Za-z0-9]{14}\b',
]
deny_patterns = [
    'GPA\s*[:=]?\s*\d\.\d',
    '\d\.\d+\s*GPA',
]
# Domains used only by fake addresses in tests and docs.
email_allow_domains = [
    "example.com", "example.org", "example.edu", "example.net", "test",
    "greenhouse.io",
]
