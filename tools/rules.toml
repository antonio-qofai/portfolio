# Personal projects. Each source README is a working document for me; the public copy gets a
# README written for readers of this repo instead.

[projects.apartment-chores]

[[projects.apartment-chores.overlay]]
path = "README.md"
from = "tools/overlays/apartment-chores/README.md"

[projects.internship-search]
exclude = ["MY_SEARCH.md", "NEXT_STEPS.md", "PRD.md", "CHANGELOG.md"]

[[projects.internship-search.overlay]]
path = "README.md"
from = "tools/overlays/internship-search/README.md"

[[projects.internship-search.overlay]]
path = "sources/contacts.toml"
from = "tools/overlays/internship-search/contacts.toml"

[[projects.internship-search.block]]
file = "rubric.md"
start = '^## The candidate$'
end = '^## Fit, 1 to 10$'
with = "tools/overlays/internship-search/rubric-candidate.md"

[projects.life-dashboard]

[[projects.life-dashboard.overlay]]
path = "README.md"
from = "tools/overlays/life-dashboard/README.md"

[projects.trip-planner]

# QofAI projects. Synced by hand after review, never by a hook. Overlays stand in
# for files built from real client material; real names live in the private config.

[projects.qofai-deck-generator]
subdir = "repos/project-status-deck-generator"
hook = false
exclude = [
    "README.md", "CLAUDE.md", "PRD.md", "CHANGELOG.md", "interview-transcript.md",
    "NEXT-*", "DEFERRED-BUILDS.md", "PROMPT-QUEUE.md", "E9-RESCOPE-DESIGN.md",
    "build-plan-*", "HANDOFF-*", "*-FINDING.md", "*-RESULT.md", "*-WRITEUP.md",
    "conversations/*", "decks/*", "generated-prompts/*", "workflow-maps/*",
    "templates/*.pdf", "templates/packets/proposal-data-packet-mbd.md",
    "data-provider/interview-transcript.md", "data-provider/CHANGELOG.md", "data-provider/PRD.md",
    "data-provider/AGENT-OS-FIELD-ASK.md",
    "ui/design-reference.html",
    "*.pdf", "*.png", "*.jpg", "*.docx", "*.pptx", "*.xlsx", "*.ipynb",
]

[projects.qofai-content-calendar]
subdir = "repos/thought-leadership-calendar-manager"
hook = false
exclude = [
    "README.md", "CLAUDE.md", "PRD.md", "CHANGELOG.md", "interview-transcript.md",
    "BUILD-PLAN-*", "FOUNDER-QUESTIONS-*", "HANDOFF-*",
    "conversations/*", "state/*", "narrative/*", "display/calendar.html",
    "*.pdf", "*.png", "*.jpg", "*.docx", "*.pptx", "*.xlsx", "*.ipynb",
]

[projects.qofai-pe-research-agent]
hook = false
exclude = [
    "README.md", "PLAYBOOK.md", "runs/*", "sources/*", "dossiers/*", "evals/*", "audits/*",
    "skills/*/example-*.md",
    "*.pdf", "*.png", "*.jpg", "*.docx", "*.pptx", "*.xlsx", "*.ipynb",
]

